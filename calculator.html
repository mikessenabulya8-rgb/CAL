<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="calcul.css">
</head>


<body>
     <main class="calculator" aria-label="calculator desing">
        <output class="display">0</output>
        <div class="keypad">
            <div class="key-row">
                <button class="key-clear">AC</button>
                <button type="button">00</button>
                <button type="button">%</button>
                <button  class="key-operator">÷</button>
            </div>
       <div class="key-row">
            <button type="button">7</button>
            <button type="button">8</button>
            <button type="button">9</button>
            <button  class="key-operator">x</button>
             </div>
      <div class="key-row">
            <button type="button">4</button>
            <button type="button">5</button>
            <button type="button">6</button>
            <button  class="key-operator">-</button>
             </div>
      <div class="key-row">
                <button type="button">1</button>
            <button type="button">2</button>
            <button type="button">3</button>
            <button  class="key-operator">+</button>
             </div>
      <div class="key-row">
            <button class="key-zero">0</button>
            <button type="button">.</button>
            <button  class="key-operator">=</button>
            </div>
        </div>
    </main>
</body>
</html>
